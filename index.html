<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HHenrique</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background"></div>

<header>
    <h1>HHenrique</h1>
    <div id="clock"></div>

    <div class="quote">
    <p id="quoteText"></p>
</div>
</header>

<form class="search" id="searchForm">
    <select id="searchScope">
        <option value="all">Tudo</option>
        <option value="docs">Documentos Pessoais</option>
        <option value="estudos">Estudos</option>
        <option value="financas">Finanças</option>
        <option value="trabalho">Arquivos de Trabalho</option>
        <option value="hobbies">Hobbies</option>
        <option value="ia">IA Lab</option>
    </select>
    <input id="searchInput" type="text" placeholder="Buscar nos meus arquivos..." autocomplete="off">
    <button type="submit">Buscar</button>
</form>

<main class="dashboard">

    <a class="card"
       href="https://hhqueiroz.sharepoint.com/sites/HHENRIQUE/Documentos%20Compartilhados/Documentos%20Pessoais"
       target="_self">
       <img src="assets/doc pessoal.png" alt="Documentos Pessoais">
    </a>

    <a class="card"
       href="https://hhqueiroz.sharepoint.com/sites/HHENRIQUE/Documentos%20Compartilhados/Estudos"
       target="_self">
       <img src="estudos.png" alt="Estudos">
    </a>

    <a class="card"
       href="https://hhqueiroz.sharepoint.com/sites/HHENRIQUE/Documentos%20Compartilhados/Finan%C3%A7as"
       target="_self">
       <img src="finan.png" alt="Finanças">
    </a>

    <a class="card"
       href="https://hhqueiroz.sharepoint.com/sites/HHENRIQUE/Documentos%20Compartilhados/Arquivos%20de%20Trabalho"
       target="_self">
       <img src="assets/arqtrab.png" alt="Arquivos de Trabalho">
    </a>

    <a class="card"
       href="https://hhqueiroz.sharepoint.com/sites/HHENRIQUE/Documentos%20Compartilhados/Hobbies"
       target="_self">
       <img src="hobbie.png" alt="Hobbies">
    </a>

    <a class="card"
       href="https://hhqueiroz.sharepoint.com/sites/HHENRIQUE/Documentos%20Compartilhados/IA%20Lab"
       target="_self">
       <img src="ialab.png" alt="IA Lab">
    </a>

</main>

<script>
// ===== RELÓGIO =====
function atualizarRelogio(){
    const el = document.getElementById("clock");
    if(!el) return;
    const agora = new Date();
    const data = agora.toLocaleDateString("pt-BR", {
        weekday:"long", day:"numeric", month:"long", year:"numeric"
    });
    el.textContent = `${data} às ${agora.toLocaleTimeString("pt-BR")}`;
}
atualizarRelogio();
setInterval(atualizarRelogio, 1000);


// ===== BUSCA =====
const BASE = "https://hhqueiroz.sharepoint.com/sites/HHENRIQUE";
const SP_SEARCH_URL = `${BASE}/_layouts/15/search.aspx`;

const scopes = {
    all:      "",
    docs:     `${BASE}/Documentos Compartilhados/Documentos Pessoais`,
    estudos:  `${BASE}/Documentos Compartilhados/Estudos`,
    financas: `${BASE}/Documentos Compartilhados/Finanças`,
    trabalho: `${BASE}/Documentos Compartilhados/Arquivos de Trabalho`,
    hobbies:  `${BASE}/Documentos Compartilhados/Hobbies`,
    ia:       `${BASE}/Documentos Compartilhados/IA Lab`
};

document.getElementById("searchForm").addEventListener("submit", e => {
    e.preventDefault();

    const termo  = document.getElementById("searchInput").value.trim();
    const escopo = document.getElementById("searchScope").value;
    if(!termo) return;

    let query = termo;
    if(scopes[escopo]){
        query = `${termo} path:"${scopes[escopo]}"`;
    }

    window.open(`${SP_SEARCH_URL}?q=${encodeURIComponent(query)}`, "_blank");
});

// atalho: "/" foca na busca
document.addEventListener("keydown", e => {
    if(e.key === "/" && document.activeElement.tagName !== "INPUT"){
        e.preventDefault();
        document.getElementById("searchInput").focus();
    }
});
</script>

</body>
</html>
